<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ mission.title }}</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --panel-soft: #f2f6fb;
      --ink: #111827;
      --muted: #5b6474;
      --line: rgba(17, 24, 39, 0.08);
      --gold: #f5c75b;
      --gold-strong: #df9f2f;
      --success: #2d9b6d;
      --danger: #d75d5d;
      --shadow: 0 24px 60px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; height: 100%; }
    body {
      display: grid; place-items: center; padding: 32px 18px;
      background: radial-gradient(circle at top, rgba(245, 199, 91, 0.16), transparent 28%),
                  linear-gradient(180deg, #f8fafc 0%, #edf3f9 100%);
      color: var(--ink); font-family: Inter, "Segoe UI", sans-serif;
    }
    .wrap {
      width: min(100%, 820px); background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(247,249,251,0.96));
      border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); padding: 32px;
    }
    .tag {
      display: inline-flex; align-items: center; border: 1px solid rgba(245,199,91,0.25);
      background: rgba(245,199,91,0.12); color: #8a6510; border-radius: 999px; padding: 8px 12px;
      font-size: 12px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase;
    }
    h1 { margin: 18px 0 10px; font-size: clamp(2.1rem, 4vw, 3.3rem); letter-spacing: -0.06em; }
    p { margin: 0; color: var(--muted); line-height: 1.7; font-size: 1.02rem; }
    .card {
      margin-top: 28px; background: linear-gradient(180deg, rgba(245,247,251,0.8), rgba(255,255,255,0.8));
      border: 1px solid var(--line); border-radius: 20px; padding: 24px;
    }
    .field { margin-bottom: 18px; }
    label { display: block; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.02em; }
    input, select, textarea, button {
      font: inherit;
    }
    input[type="text"], input[type="email"], select, textarea {
      width: 100%; box-sizing: border-box; padding: 14px 16px; border: 1px solid rgba(17,24,39,0.1);
      border-radius: 12px; background: rgba(255,255,255,0.8); color: var(--ink); font-size: 1rem;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: rgba(245,199,91,0.8); box-shadow: 0 0 0 4px rgba(245, 199, 91, 0.14); }
    .checkboxes, .radios { display: grid; gap: 10px; margin-top: 8px; }
    .checkboxes label, .radios label {
      display: flex; align-items: center; gap: 10px; font-weight: 600; background: rgba(255,255,255,0.5);
      border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0;
    }
    .checkboxes input, .radios input { width: auto; margin: 0; }
    textarea { min-height: 120px; resize: vertical; }
    button {
      margin-top: 16px; padding: 13px 20px; border: 0; border-radius: 12px;
      background: linear-gradient(135deg, var(--gold) 0%, #f0d980 100%); color: #1f2937; font-weight: 800; cursor: pointer;
    }
    #result { min-height: 24px; margin-top: 18px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="tag">Missão {{ mission.number }}</span>
    <h1>{{ mission.title }}</h1>
    <p>{{ mission.summary }}</p>

    <div class="card">
      {% if mission.id == 'mission-01' %}
        <div class="field">
          <label for="nome">Nome do cliente</label>
          <input id="nome" type="text" placeholder="Digite um nome">
        </div>
        <button id="cadastrar" onclick="cadastro()">Cadastrar cliente</button>
      {% elif mission.id == 'mission-02' %}
        <div class="field">
          <label for="canal">Canal de contato</label>
          <select id="canal">
            <option value="">Selecione...</option>
            <option value="email">E-mail</option>
            <option value="sms">SMS</option>
            <option value="whatsapp">WhatsApp</option>
          </select>
        </div>
        <button id="continuar" onclick="continuar()">Continuar</button>
      {% elif mission.id == 'mission-03' %}
        <div class="field">
          <label>Notificações</label>
          <div class="checkboxes">
            <label><input id="notificacoes" type="checkbox"> Receber e-mails</label>
            <label><input id="relatorios" type="checkbox"> Receber relatórios</label>
            <label><input id="alertas" type="checkbox"> Receber alertas</label>
          </div>
        </div>
        <div class="field">
          <label>Perfil</label>
          <div class="radios">
            <label><input name="perfil" id="perfil-pessoal" type="radio" value="pessoal"> Pessoal</label>
            <label><input name="perfil" id="perfil-profissional" type="radio" value="profissional"> Profissional</label>
            <label><input name="perfil" id="perfil-empresa" type="radio" value="empresa"> Empresa</label>
          </div>
        </div>
        <button id="salvar-preferencias" onclick="salvarPreferencias()">Salvar preferências</button>
      {% elif mission.id == 'mission-04' %}
        <div class="field">
          <label for="setor">Setor</label>
          <select id="setor">
            <option value="">Selecione...</option>
            <option value="tecnologia">Tecnologia</option>
            <option value="financeiro">Financeiro</option>
            <option value="vendas">Vendas</option>
          </select>
        </div>
        <div class="field">
          <label>Módulos</label>
          <div class="checkboxes">
            <label><input id="relatorios" type="checkbox"> Relatórios</label>
            <label><input id="automacao" type="checkbox"> Automação</label>
            <label><input id="integracoes" type="checkbox"> Integrações</label>
          </div>
        </div>
        <div class="field">
          <label>Prioridade</label>
          <div class="radios">
            <label><input name="prioridade" id="prioridade-baixa" type="radio" value="baixa"> Baixa</label>
            <label><input name="prioridade" id="prioridade-media" type="radio" value="media"> Média</label>
            <label><input name="prioridade" id="prioridade-alta" type="radio" value="alta"> Alta</label>
          </div>
        </div>
        <div class="field">
          <label for="observacoes">Observações</label>
          <textarea id="observacoes" placeholder="Descreva a necessidade do cliente..."></textarea>
        </div>
        <button id="concluir" onclick="concluirCadastro()">Concluir cadastro</button>
      {% endif %}

      <div id="result"></div>
    </div>
  </div>

  <script>
    function setResult(message, success) {
      const result = document.getElementById('result');
      result.textContent = message;
      result.style.color = success ? 'var(--success)' : 'var(--danger)';
    }

    function cadastro() {
      const nome = document.getElementById('nome').value.trim();
      setResult(nome ? `Cliente ${nome} cadastrado pelo robô.` : 'Digite um nome antes de continuar.', !!nome);
    }

    function continuar() {
      const canal = document.getElementById('canal').value;
      setResult(canal ? `Canal selecionado: ${canal}. Progresso registrado.` : 'Selecione um canal antes de continuar.', !!canal);
    }

    function salvarPreferencias() {
      const notificacoes = document.getElementById('notificacoes').checked;
      const perfil = document.querySelector('input[name="perfil"]:checked');
      if (!notificacoes || !perfil) {
        setResult('Marca pelo menos uma opção e selecione um perfil.', false);
        return;
      }
      setResult(`Preferências salvas para perfil ${perfil.value}.`, true);
    }

    function concluirCadastro() {
      const setor = document.getElementById('setor').value;
      const checkedModules = [
        document.getElementById('relatorios').checked,
        document.getElementById('automacao').checked,
        document.getElementById('integracoes').checked
      ].filter(Boolean).length;
      const prioridade = document.querySelector('input[name="prioridade"]:checked');
      const observacoes = document.getElementById('observacoes').value.trim();

      const valid = setor && checkedModules >= 1 && prioridade && observacoes;
      setResult(valid ? `Cadastro completo para ${setor} com prioridade ${prioridade.value}.` : 'Preencha setor, módulo, prioridade e observação antes de concluir.', valid);
    }
  </script>
</body>
</html>
